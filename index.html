const $=s=>document.querySelector(s);
const esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};

function norm(t){return t.toLowerCase().replace(/[.,!?¿¡;:"'„“”…–-]/g," ").replace(/\s+/g," ").trim();}
function umlautFold(t){return t.replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue").replace(/ß/g,"ss");}
function lev(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let p=[...Array(n+1).keys()];for(let i=1;i<=m;i++){let c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c;}return p[n];}
function sim(a,b){a=umlautFold(norm(a));b=umlautFold(norm(b));const L=Math.max(a.length,b.length)||1;return 1-lev(a,b)/L;}

function lessonPct(l){const acts=ACTS.filter(a=>a.ex&&(!a.need||a.need(l)));const s=acts.reduce((x,a)=>x+starsOf(l.id,a.id),0);return Math.round(100*s/(acts.length*3));}
function starStr(n){return "★".repeat(n)+"☆".repeat(3-n);}

 return `<div class="hero"><div><div class="hi">Hallo, ${esc(S.name)}! 👋</div><div class="sub">🔥 ${S.streak} ${S.streak===1?"zi":"zile"} la rând</div></div><button class="ic light" data-go='{"v":"settings"}'>⚙️</button></div>

/* ===== exercises ===== */
let EX=null;
function allVocab(l){return l.vocab.map(pair);}
function opts(correct,pool,n=4){const o=shuf(pool.filter(x=>x!==correct)).slice(0,n-1);o.push(correct);return shuf([...new Set(o)]);}
const NUM=["null","eins","zwei","drei","vier","fünf","sechs","sieben","acht","neun","zehn","elf","zwölf","dreizehn","vierzehn","fünfzehn","sechzehn","siebzehn","achtzehn","neunzehn","zwanzig"];
const NUMRO=["zero","unu","doi","trei","patru","cinci","șase","șapte","opt","nouă","zece","unsprezece","doisprezece"];
function clockQ(){const h=1+Math.floor(Math.random()*12),m=pick([0,15,30,45]);const hn=x=>NUM[((x-1)%12)+1];
 let de=m===0?(h===1?"ein":hn(h))+" Uhr":m===15?"Viertel nach "+hn(h):m===30?"halb "+hn(h+1):"Viertel vor "+hn(h+1);
 const hr=x=>NUMRO[((x-1)%12)+1];let ro=m===0?"ora "+hr(h):m===15?hr(h)+" și un sfert":m===30?hr(h)+" și jumătate":hr(h+1)+" fără un sfert";
 return{time:h+":"+String(m).padStart(2,"0"),de,ro};}
function genQs(l,a){const V=l?allVocab(l):[];const N=10;let qs=[];
 const words=V.filter(v=>v.de.split(" ").length<=3);
 if(a==="quiz"){qs=shuf(V).slice(0,N).map((v,i)=>i%2?{k:"choice",prompt:v.ro,sub:"Alege în germană:",ans:v.de,opts:opts(v.de,V.map(x=>x.de)),say:v.de,item:v.de}:{k:"choice",prompt:v.de,sub:"Ce înseamnă?",ans:v.ro,opts:opts(v.ro,V.map(x=>x.ro)),say:v.de,sayFirst:true,item:v.de});}
 if(a==="listen"){qs=shuf(V).slice(0,N).map(v=>({k:"choice",audio:v.de,sub:"Ascultă și alege traducerea:",ans:v.ro,opts:opts(v.ro,V.map(x=>x.ro)),say:v.de,item:v.de}));}
 if(a==="article"){const ns=V.filter(v=>art(v.de));qs=shuf(ns).slice(0,N).map(v=>{const x=art(v.de);return{k:"choice",prompt:"___ "+x.n,sub:v.ro,ans:x.a,opts:["der","die","das"],say:v.de,item:v.de,art:true};});}
 if(a==="numbers"){qs=shuf([...Array(21).keys()]).slice(0,N).map((n,i)=>i%2?{k:"type",audio:NUM[n],sub:"Scrie cifra pe care o auzi:",ans:String(n),num:true,say:NUM[n]}:{k:"type",prompt:String(n),sub:"Scrie numărul în germană:",ans:NUM[n],say:NUM[n]});}
 if(a==="akk"){const ns=V.filter(v=>art(v.de)&&/(Kuli|Bleistift|Radiergummi|Spitzer|Block|Filzstift|Kleber|Lineal|Heft|Buch|Mäppchen|Schere|Schultasche|Roboter)/.test(v.de));
  qs=shuf(ns).slice(0,N).map(v=>{const x=art(v.de);const a2={der:"einen",die:"eine",das:"ein"}[x.a];const verb=pick(["Ich brauche","Ich möchte","Hast du","Wir kaufen"]);const q=verb==="Hast du";
   return{k:"choice",prompt:`${verb} ___ ${x.n}${q?"?":"."}`,sub:`${v.de} — ${v.ro}`,ans:a2,opts:["ein","eine","einen"],say:`${verb} ${a2} ${x.n}`,item:v.de};});}
 if(a==="clock"){qs=[...Array(N)].map((_,i)=>{const c=clockQ();return i%2?{k:"choice",audio:c.de,sub:"Ascultă: cât e ceasul?",ans:c.time,opts:opts(c.time,[...Array(8)].map(()=>clockQ().time).concat(c.time)),say:c.de}:{k:"choice",prompt:"🕒 "+c.time,sub:`(${c.ro}) Cum se spune în germană?`,ans:c.de,opts:opts(c.de,[...Array(8)].map(()=>clockQ().de)),say:c.de};});}
 if(a==="dictation"){qs=shuf(words).slice(0,7).concat(shuf(l.sentences.map(pair)).slice(0,3)).map(v=>({k:"type",audio:v.de,sub:"Ascultă și scrie exact ce auzi:",hint:v.ro,ans:v.de,say:v.de,item:v.de}));}
 if(a==="translate"){qs=shuf(words).slice(0,6).concat(shuf(l.sentences.map(pair)).slice(0,4)).map(v=>({k:"type",prompt:v.ro,sub:"Scrie în germană:",ans:v.de,say:v.de,item:v.de}));}
 if(a==="builder"){qs=shuf(l.sentences.map(pair)).slice(0,6).map(v=>({k:"build",prompt:v.ro,sub:"Pune cuvintele în ordine:",ans:v.de,tiles:shuf(v.de.replace(/[.!?]$/,"").split(" ")),end:(v.de.match(/[.!?]$/)||[""])[0],say:v.de}));}
 if(a==="conj"){const it=[];l.conj.forEach(c=>Object.entries(c.f).forEach(([p,f])=>it.push({c,p,f})));
  qs=shuf(it).slice(0,N).map(x=>{const pr=x.p.split("/")[0];return{k:"type",prompt:`${pr} ___`,sub:`${x.c.v} (${x.c.ro}) — scrie forma pentru „${x.p}”:`,ans:x.f,say:`${pr} ${x.f}`};});}
 if(a==="speak"){const src=shuf(l.sentences.map(pair).concat(l.dialog.map(d=>{const[,de,ro]=d.split("|");return{de,ro};}))).slice(0,6);qs=src.map(v=>({k:"speak",prompt:v.de,sub:v.ro,ans:v.de,say:v.de}));}
 if(a==="review"){const keys=Object.keys(S.mist);const pool=LESSONS.flatMap(x=>allVocab(x));const items=shuf(keys).slice(0,N).map(k=>pool.find(p=>p.de===k)).filter(Boolean);
  qs=items.map((v,i)=>i%2?{k:"type",prompt:v.ro,sub:"Scrie în germană:",ans:v.de,say:v.de,item:v.de}:{k:"choice",audio:v.de,sub:"Ascultă și alege:",ans:v.ro,opts:opts(v.ro,pool.map(x=>x.ro)),say:v.de,item:v.de});}
 return qs;}
function startEx(l,a){const qs=genQs(l,a);EX={l:l?l.id:null,a,qs,i:0,ok:0,state:"ask",built:[],typed:"",fb:null};}

function exScreen(){if(!EX||EX.key!==JSON.stringify(VIEW)){startEx(VIEW.l?L(VIEW.l):null,VIEW.a);EX.key=JSON.stringify(VIEW);}
 const back=EX.l?`{"v":"lesson","l":"${EX.l}"}`:'{"v":"home"}';const act=ACTS.find(x=>x.id===EX.a)||{t:"Recapitulare",ic:"🔁"};
 if(!EX.qs.length)return topBar(act.t,back)+`<div class="pad"><p>Nu sunt întrebări aici încă.</p></div>`;
 if(EX.i>=EX.qs.length){const pct=EX.ok/EX.qs.length;const st=pct>=.9?3:pct>=.7?2:pct>=.5?1:0;
  if(EX.l&&!EX.saved){S.prog[EX.l]=S.prog[EX.l]||{};S.prog[EX.l][EX.a]=Math.max(st,S.prog[EX.l][EX.a]||0);save();EX.saved=1;
   say([{t:st===3?"Excelent! Ai luat trei stele!":st>=1?"Bravo! Mai încearcă o dată pentru trei stele.":"Nu-i nimic, mai exersăm o dată.",l:"ro"}]);}
  return topBar(act.t,back)+`<div class="pad center"><div class="res">${st===3?"🏆":st>=1?"🎉":"💪"}</div><h2>${EX.ok} din ${EX.qs.length}</h2><div class="bigst">${starStr(st)}</div>
  <button class="btn primary wide" data-act="again">Încă o dată</button><button class="btn wide" data-go='${back}'>Înapoi la lecție</button></div>`;}
 const q=EX.qs[EX.i];
 let body=`<div class="prog"><i style="width:${100*EX.i/EX.qs.length}%"></i></div><div class="qsub">${esc(q.sub)}</div>`;
 if(q.audio)body+=`<button class="play" data-sayq="1">🔊</button><button class="slow" data-slow="1">🐢 încet</button>`;
 if(q.prompt)body+=`<div class="qp">${esc(q.prompt)}</div>`;
 if(q.hint&&EX.state!=="ask")body+=`<div class="qh">${esc(q.hint)}</div>`;
 if(q.k==="choice")body+=`<div class="opts ${q.art?"three":""}">${q.opts.map(o=>{let c="";if(EX.state!=="ask"){if(o===q.ans)c="good";else if(o===EX.chosen)c="bad";}return `<button class="opt ${c} ${q.art?"a-"+o:""}" data-opt="${esc(o)}" ${EX.state!=="ask"?"disabled":""}>${esc(o)}</button>`;}).join("")}</div>`;
 if(q.k==="type")body+=`<input id="tin" class="tin" ${q.num?'inputmode="numeric"':""} autocomplete="off" autocapitalize="off" spellcheck="false" value="${esc(EX.typed)}" ${EX.state!=="ask"?"disabled":""} placeholder="Scrie aici…">${q.num?"":`<div class="uml">${["ä","ö","ü","ß","Ä","Ö","Ü"].map(c=>`<button data-uml="${c}">${c}</button>`).join("")}</div>`}${EX.state==="ask"?`<button class="btn primary wide" data-act="check">Verifică</button>`:""}`;
 if(q.k==="build"){const used=EX.built;body+=`<div class="built">${used.map((t,i)=>`<button class="tile2" data-unb="${i}">${esc(q.tiles[t])}</button>`).join("")}<span class="endp">${q.end}</span></div>
  <div class="pool">${q.tiles.map((t,i)=>used.includes(i)?`<span class="tile2 ghost">${esc(t)}</span>`:`<button class="tile2" data-b="${i}">${esc(t)}</button>`).join("")}</div>${EX.state==="ask"?`<button class="btn primary wide" data-act="checkb" ${used.length===q.tiles.length?"":"disabled"}>Verifică</button>`:""}`;}
 if(q.k==="speak"){body+=`<button class="play" data-sayq="1">🔊</button><button class="slow" data-slow="1">🐢 încet</button>
  ${canListen()?`<button class="mic big" data-act="spk">🎤 Spune acum</button><div class="heard" id="heard">${esc(EX.heard||"")}</div>`:`<p class="hint">Ascultă, repetă cu voce tare de 2–3 ori, apoi apreciază singur:</p>${EX.state==="ask"?`<div class="row2"><button class="btn good" data-self="1">👍 Am reușit</button><button class="btn" data-self="0">🔁 Încă nu</button></div>`:""}`}`;}
 if(EX.fb)body+=`<div class="fb ${EX.fb.ok?"ok":"no"}">${EX.fb.html}</div><button class="btn primary wide" data-act="next">Mai departe →</button>`;
 return topBar(`${act.ic} ${act.t}`,back)+`<div class="pad">${body}</div>`;}

const PRAISE=["Bravo!","Super!","Excelent!","Foarte bine!","Perfect!"];
function grade(ok,html,partial){const q=EX.qs[EX.i];EX.state="done";if(ok)EX.ok++;
 if(q.item){if(ok){if(S.mist[q.item]){S.mist[q.item]--;if(S.mist[q.item]<=0)delete S.mist[q.item];}}else S.mist[q.item]=2;save();}
 EX.fb={ok,html};render();
 const parts=[];if(ok)parts.push({t:pick(PRAISE),l:"ro"});else parts.push({t:"Nu chiar. Corect este:",l:"ro"});
 parts.push({t:q.say||q.ans,l:"de"});say(parts);}
function checkTyped(){const q=EX.qs[EX.i];const v=($("#tin").value||"").trim();EX.typed=v;if(!v)return;
 const strip=s=>s.replace(/[.!?]+$/,"").replace(/\s+/g," ").trim();
 const a=strip(q.ans),b=strip(v);
 if(a===b)return grade(true,`✅ ${pick(PRAISE)} <b>${esc(q.ans)}</b>`);
 if(a.toLowerCase()===b.toLowerCase())return grade(true,`✅ Aproape perfect! Atenție la literele mari: <b>${esc(q.ans)}</b>${/^[A-ZÄÖÜ]/.test(a.split(" ").find(w=>/^[A-ZÄÖÜ]/.test(w))||"")?"<br><small>În germană substantivele se scriu cu literă mare.</small>":""}`);
 if(umlautFold(a.toLowerCase())===umlautFold(b.toLowerCase()))return grade(true,`✅ Corect! Dar scrie cu literele speciale: <b>${esc(q.ans)}</b>`);
 const s=sim(a,b);grade(false,`❌ Corect este: <b>${esc(q.ans)}</b>${s>.75?"<br><small>Ai fost foarte aproape!</small>":""}<br><small>Tu ai scris: ${esc(v)}</small>`);}

/* ===== events ===== */
function bindCommon(){
 document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{const v=JSON.parse(b.dataset.go);if(v.v==="ex")EX=null;if(v.v==="tutor"||v.v==="ask")CHAT.key=null;if(v.v==="dialog")DLG.res={};go(v);if(v.v==="ex")autoAudio();});
 document.querySelectorAll("[data-say]").forEach(b=>b.addEventListener("click",e=>{e.stopPropagation();sayDe(b.dataset.say);}));
 document.querySelectorAll("[data-act]").forEach(b=>b.addEventListener("click",()=>ACT[b.dataset.act]&&ACT[b.dataset.act](b)));
 document.querySelectorAll("[data-para]").forEach(b=>b.onclick=()=>{const l=L(VIEW.l);const el=b.parentElement;say(splitMixed(l.explain[+b.dataset.para]).map(p=>({...p,el})));});
 document.querySelectorAll("[data-role]").forEach(b=>b.onclick=()=>{DLG.role=b.dataset.role;DLG.res={};render();});
 const hd=$("#hideDe");if(hd)hd.onchange=()=>{DLG.hide=hd.checked;render();};
 document.querySelectorAll("[data-dmic]").forEach(b=>b.onclick=()=>dlgMic(+b.dataset.dmic,b));
 const rs=$("#rate");if(rs)rs.oninput=()=>{S.rateDe=+rs.value;save();$("#ratev").textContent=rs.value;};
}
const ACT={
 stop:()=>{stopSpeak();stopListen();},
 readall:()=>{const l=L(VIEW.l);const parts=[];document.querySelectorAll(".para").forEach((el,i)=>splitMixed(l.explain[i]).forEach(p=>parts.push({...p,el})));say(parts);},
 readvocab:()=>{const l=L(VIEW.l);const els=[...document.querySelectorAll(".vc")];const parts=[];l.vocab.forEach((v,i)=>{const p=pair(v);parts.push({t:p.de,l:"de",el:els[i]},{t:p.ro,l:"ro",el:els[i]});});say(parts);},
 review:()=>{EX=null;go({v:"ex",a:"review"});},
 again:()=>{EX=null;render();autoAudio();},
 check:checkTyped,
 checkb:()=>{const q=EX.qs[EX.i];const got=EX.built.map(i=>q.tiles[i]).join(" ")+q.end;const ok=got.replace(/[.!?]$/,"")===q.ans.replace(/[.!?]$/,"");grade(ok,ok?`✅ ${pick(PRAISE)} <b>${esc(q.ans)}</b>`:`❌ Corect este: <b>${esc(q.ans)}</b><br><small>Amintește-ți: verbul stă pe locul doi!</small>`);},
 next:()=>{EX.i++;EX.state="ask";EX.fb=null;EX.typed="";EX.built=[];EX.chosen=null;EX.heard="";render();autoAudio();},
 spk:(b)=>{const q=EX.qs[EX.i];b.textContent="👂 Ascult… (apasă ca să opresc)";b.dataset.act="stopl";b.onclick=()=>stopListen();
  listen(t=>{const h=$("#heard");if(h)h.textContent=t;}).then(t=>{EX.heard=t||"";if(!t){EX.fb=null;render();const h=$("#heard");if(h)h.textContent="Nu te-am auzit. Mai încearcă!";return;}
   const s=sim(t,q.ans);const ok=s>=.7;grade(ok,ok?`✅ ${pick(PRAISE)} Am înțeles: „${esc(t)}”`:`🔁 Am auzit: „${esc(t)}”<br>Ascultă din nou și încearcă: <b>${esc(q.ans)}</b>`);});},
 settestro:()=>say([{t:"Bună! Eu sunt vocea care îți explică în română.",l:"ro"}]),
 settestde:()=>say([{t:"Hallo! Ich bin die deutsche Stimme.",l:"de"}]),
 reset:(b)=>{if(b.dataset.sure){S.prog={};S.mist={};save();go({v:"home"});}else{b.dataset.sure=1;b.textContent="Apasă încă o dată pentru confirmare";}},
 rename:()=>{S.name="";save();go({v:"home"});},
 dlgplay:dlgPlay,
 send:()=>chatSend(),
 mic:(b)=>chatMic(b)
};
function autoAudio(){const q=EX&&EX.qs[EX.i];if(!q)return;if(q.audio)sayDe(q.audio);else if(q.sayFirst||q.k==="speak")sayDe(q.say);}
function bindEx(){
 document.querySelectorAll("[data-opt]").forEach(b=>b.onclick=()=>{const q=EX.qs[EX.i];EX.chosen=b.dataset.opt;const ok=EX.chosen===q.ans;grade(ok,ok?`✅ ${pick(PRAISE)} <b>${esc(q.say||q.ans)}</b>`:`❌ Corect: <b>${esc(q.ans)}</b>${q.say&&q.say!==q.ans?` — ${esc(q.say)}`:""}`);});
 document.querySelectorAll("[data-sayq]").forEach(b=>b.onclick=()=>sayDe(EX.qs[EX.i].say));
 document.querySelectorAll("[data-slow]").forEach(b=>b.onclick=()=>{const r=S.rateDe;S.rateDe=.6;sayDe(EX.qs[EX.i].say).then(()=>{S.rateDe=r;});setTimeout(()=>S.rateDe=r,200);});
 document.querySelectorAll("[data-uml]").forEach(b=>b.onclick=()=>{const i=$("#tin");if(!i)return;const p=i.selectionStart??i.value.length;i.value=i.value.slice(0,p)+b.dataset.uml+i.value.slice(i.selectionEnd??p);i.focus();i.setSelectionRange(p+1,p+1);});
 const t=$("#tin");if(t){t.addEventListener("keydown",e=>{if(e.key==="Enter")checkTyped();});t.addEventListener("input",()=>EX.typed=t.value);if(EX.state==="ask")setTimeout(()=>t.focus(),50);}
 document.querySelectorAll("[data-b]").forEach(b=>b.onclick=()=>{EX.built.push(+b.dataset.b);sayDe(EX.qs[EX.i].tiles[+b.dataset.b]);render();});
 document.querySelectorAll("[data-unb]").forEach(b=>b.onclick=()=>{if(EX.state!=="ask")return;EX.built.splice(+b.dataset.unb,1);render();});
 document.querySelectorAll("[data-self]").forEach(b=>b.onclick=()=>{const ok=b.dataset.self==="1";grade(ok,ok?"✅ Bravo! Continuă tot așa!":"🔁 Ascultă încă o dată și repetă. Data viitoare va ieși!");});
}

/* dialog play */
async function dlgPlay(){const l=L(VIEW.l);const lines=l.dialog.map(x=>{const[w,de,ro]=x.split("|");return{w,de,ro};});
 stopSpeak();const tok=speakToken;DLG.res={};
 for(let i=0;i<lines.length;i++){if(tok!==speakToken)return;const el=$("#dl"+i);if(!el)return;el.scrollIntoView({behavior:"smooth",block:"center"});
  if(lines[i].w===DLG.role){el.classList.add("turn");await new Promise(r=>{DLG.wait=r;});el.classList.remove("turn");if(tok!==speakToken)return;continue;}
  el.classList.add("speaking");await sayOne(lines[i].de,"de",tok);el.classList.remove("speaking");await new Promise(r=>setTimeout(r,300));}
 if(tok===speakToken)say([{t:"Bravo! Ai terminat dialogul.",l:"ro"}]);}
function dlgMic(i,b){const l=L(VIEW.l);const de=l.dialog[i].split("|")[1];const h=$("#dh"+i);
 if(!canListen()){DLG.wait&&DLG.wait();DLG.wait=null;return;}
 b.textContent="👂 Ascult…";
 const resumeTok=speakToken;
 listen(t=>{h.textContent=t;}).then(t=>{b.textContent="🎤 Spune";if(!t){h.textContent="Nu te-am auzit. Mai încearcă!";return;}
  const s=sim(t,de);DLG.res[i]=t;h.innerHTML=(s>=.7?"✅ ":"🔁 ")+esc(t);
  if(s>=.7){if(DLG.wait){const w=DLG.wait;DLG.wait=null;speakToken=resumeTok;w();}}else{sayOne(de,"de",speakToken);}});
 // listen() calls stopSpeak -> keep the dialog token alive
 speakToken=resumeTok;}

/* ===== AI tutor & ask ===== */
let CHAT={key:null,msgs:[],busy:false};
function tutorLesson(){return L(VIEW.l);}
function lessonsUpTo(l){const i=LESSONS.indexOf(l);return LESSONS.slice(0,i+1);}
function tutorSystem(l){const up=lessonsUpTo(l);
 const vocab=up.flatMap(x=>x.vocab.map(v=>pair(v).de)).join(", ");
 return `Ești „Lina”, o tutoră prietenoasă de limba germană pentru un copil (${S.name}) vorbitor de română, care învață după manualul „Beste Freunde A1.1”. Lecția curentă: ${l.nr} „${l.title}”. Sarcina conversației: ${l.tutor}
Reguli stricte:
- Vorbești cu copilul în GERMANĂ foarte simplă (nivel A1, propoziții de 3–8 cuvinte), folosind doar gramatica și vocabularul lecțiilor parcurse: ${up.map(x=>x.nr+" "+x.title).join("; ")}. Vocabular permis (plus cuvinte internaționale evidente): ${vocab}.
- Fiecare replică a ta: o reacție scurtă + O SINGURĂ întrebare simplă, ca să continue conversația.
- Dacă copilul face o greșeală, o corectezi blând în ROMÂNĂ în câmpul "corectura" (scurt, cu forma corectă în germană). Dacă nu e greșeală, lasă "corectura" gol.
- Dacă copilul scrie în română, ajută-l să spună același lucru în germană.
- Lauzi des, ești caldă și răbdătoare. Nu folosi emoji în câmpul "de".
Răspunde DOAR cu JSON valid, fără alt text: {"de":"replica ta în germană","ro":"traducerea ei în română","corectura":"corectare în română sau șir gol"}`;}
function askSystem(){return `Ești un profesor de limba germană răbdător, care explică în ROMÂNĂ unui copil (${S.name}) ce învață după manualul „Beste Freunde A1.1” (Start și Lecțiile 1–6: saluturi, numere, der/die/das, conjugarea la prezent, sein, haben, verbul pe locul 2, gern/nicht, in/aus, finden, sprechen, ein/eine/einen, möchten, können, müssen, ora). Răspunde scurt și clar (maxim 6 propoziții), cu exemple. Pune ORICE cuvânt sau exemplu german între paranteze duble, ca [[Ich heiße Ana]], ca aplicația să-l poată citi cu voce germană. Fără markdown, fără liste lungi.`;}
function tutorScreen(){const l=tutorLesson();if(CHAT.key!=="t"+l.id){CHAT={key:"t"+l.id,msgs:[],busy:false};}if(!CHAT.started)setTimeout(()=>chatStart(),50);
 return topBar("🤖 Tutorele Lina",`{"v":"lesson","l":"${l.id}"}`)+chatBody(`Conversație despre: ${l.tutor}`);}
function askScreen(){if(CHAT.key!=="ask"){CHAT={key:"ask",msgs:[],busy:false};}
 return topBar("🙋 Întreabă profesorul",'{"v":"home"}')+chatBody("Scrie orice întrebare în română, de exemplu: „Când folosesc der și când die?” sau „Cum se spune «am nevoie de o carte»?”");}
function chatBody(intro){
 if(!CAP.sample)return `<div class="pad"><div class="note">🤖 Partea cu inteligență artificială funcționează când aplicația este deschisă în contul Claude (claude.ai). Restul aplicației merge oriunde.<br><br>Până atunci, exersează cu „Dialog” și „Repetă după mine”.</div></div>`;
 return `<div class="pad chat"><div class="note">${esc(intro)}</div><div id="msgs">${CHAT.msgs.map(msgHTML).join("")}${CHAT.busy?`<div class="msg ai"><i>Lina se gândește…</i></div>`:""}</div></div>
 <div class="composer"><div class="uml">${["ä","ö","ü","ß"].map(c=>`<button data-uml2="${c}">${c}</button>`).join("")}</div>
 <div class="crow">${canListen()&&CHAT.key!=="ask"?`<button class="ic mic" data-act="mic">🎤</button>`:""}<input id="cin" placeholder="${CHAT.key==="ask"?"Întrebarea ta…":"Scrie în germană…"}" autocomplete="off"><button class="btn primary" data-act="send" ${CHAT.busy?"disabled":""}>➤</button></div></div>`;}
function msgHTML(m,i){if(m.role==="user")return `<div class="msg me">${esc(m.show||m.content)}</div>`;
 if(m.ask)return `<div class="msg ai"><button class="pl" data-replay="${i}">▶</button> ${mixedHTML(m.text)}</div>`;
 return `<div class="msg ai"><div class="dde" data-say="${esc(m.de)}">🔊 ${esc(m.de)}</div>${S.showRo?`<div class="dro">${esc(m.ro)}</div>`:`<button class="tr" data-tr="${i}">🇷🇴 traducere</button>`}${m.cor?`<div class="cor">✏️ ${mixedHTML(m.cor)}</div>`:""}</div>`;}
function bindChat(){const i=$("#cin");if(i){i.addEventListener("keydown",e=>{if(e.key==="Enter")chatSend();});}
 document.querySelectorAll("[data-uml2]").forEach(b=>b.onclick=()=>{const i=$("#cin");i.value+=b.dataset.uml2;i.focus();});
 document.querySelectorAll("[data-replay]").forEach(b=>b.onclick=()=>say(splitMixed(CHAT.msgs[+b.dataset.replay].text)));
 document.querySelectorAll("[data-tr]").forEach(b=>b.onclick=()=>{b.outerHTML=`<div class="dro">${esc(CHAT.msgs[+b.dataset.tr].ro)}</div>`;});
 const m=$("#msgs");if(m)m.lastElementChild&&m.lastElementChild.scrollIntoView({block:"end"});}
function parseJSON(t){try{return JSON.parse(t);}catch(e){}const a=t.indexOf("{"),b=t.lastIndexOf("}");if(a>=0&&b>a){try{return JSON.parse(t.slice(a,b+1));}catch(e){}}return null;}
async function callAI(){CHAT.busy=true;render();
 const ask=CHAT.key==="ask";const l=ask?null:tutorLesson();
 const sys=ask?askSystem():tutorSystem(l);
 const hist=CHAT.msgs.map(m=>m.role==="user"?{role:"user",content:m.content}:{role:"assistant",content:m.ask?m.text:JSON.stringify({de:m.de,ro:m.ro,corectura:m.cor||""})});
 if(!hist.length&&ask){CHAT.busy=false;render();return;}
 let input;if(hist.length&&hist[0].role==="user"){input=hist.slice();input[0]={role:"user",content:sys+"\n\nMesajul copilului: "+hist[0].content};}
 else input=[{role:"user",content:sys+"\n\n(Începe conversația acum cu un salut și o întrebare.)"},...hist];
 try{const r=await CAP.sample(input,{cache:false,modelTier:"default"});
  if(ask){CHAT.msgs.push({role:"assistant",ask:true,text:r.text.trim()});CHAT.busy=false;render();say(splitMixed(r.text));}
  else{const j=parseJSON(r.text)||{de:r.text.trim(),ro:"",corectura:""};CHAT.msgs.push({role:"assistant",de:j.de||"",ro:j.ro||"",cor:j.corectura||""});CHAT.busy=false;render();
   const parts=[];if(j.corectura)parts.push(...splitMixed(j.corectura));parts.push({t:j.de,l:"de"});say(parts);}
 }catch(e){CHAT.busy=false;CHAT.msgs.push({role:"assistant",ask:true,text:e&&e.code==="rate_limited"?"Prea multe mesaje deodată. Așteaptă puțin și încearcă din nou.":e&&e.code==="not_granted"?"Tutorele nu are permisiunea de a porni. Verifică setările.":"Nu am putut răspunde acum. Încearcă din nou."});render();}}
function chatStart(){if(CHAT.key&&CHAT.key!=="ask"&&!CHAT.msgs.length&&!CHAT.busy&&!CHAT.started&&CAP.sample){CHAT.started=1;callAI();}}
function chatSend(){const i=$("#cin");if(!i||CHAT.busy)return;const v=i.value.trim();if(!v)return;CHAT.msgs.push({role:"user",content:v});callAI();}
function chatMic(b){b.textContent="👂";listen(t=>{const i=$("#cin");if(i)i.value=t;}).then(t=>{b.textContent="🎤";if(t){const i=$("#cin");if(i)i.value=t;}});}

function settingsScreen(){const ro=voiceFor("ro"),de=voiceFor("de");
 return topBar("Setări",'{"v":"home"}')+`<div class="pad">
 <h3 class="gh">Voci</h3>
 <div class="note">Voce română: <b>${ro?esc(ro.name):CAP.tts?"vocea Claude":"nu a fost găsită"}</b><br>Voce germană: <b>${de?esc(de.name):CAP.tts?"vocea Claude":"nu a fost găsită"}</b>
 ${(!ro||!de)&&!CAP.tts?`<br><small>Pe Android: Setări → Accesibilitate → Text în vorbire → Google → instalează limbile română și germană. Pe iPhone: Setări → Accesibilitate → Conținut vorbit → Voci.</small>`:""}</div>
 <div class="row2"><button class="btn" data-act="settestro">🔊 Test română</button><button class="btn" data-act="settestde">🔊 Test germană</button></div>
 <label>Viteza vocii germane: <b id="ratev">${S.rateDe}</b></label><input type="range" id="rate" min="0.6" max="1.1" step="0.05" value="${S.rateDe}">
 <label class="chk"><input type="checkbox" id="showro" ${S.showRo?"checked":""} onchange="S.showRo=this.checked;save()"> Arată traducerea la tutore</label>
 <h3 class="gh">Microfon</h3><div class="note">${canListen()?"✅ Recunoașterea vocii este disponibilă.":"Recunoașterea vocii nu este disponibilă în acest browser. Exercițiile de vorbire merg în modul „repetă și apreciază singur”."}</div>
 <h3 class="gh">Profil</h3><button class="btn wide" data-act="rename">Schimbă numele (${esc(S.name)})</button><button class="btn wide danger" data-act="reset">Șterge tot progresul</button></div>`;}

render();
</script></body></html>
